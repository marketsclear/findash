name: Collect ETF data

on:
  schedule:
    # Observed publication times (UTC) for a trading day T: iShares and Grayscale ~22:30 on T,
    # Franklin ~00:20, Invesco ~04:00, Morgan Stanley ~05:30, VanEck ~10:15 on T+1, Bitwise during
    # the US day on T+1. Five short runs cover them; each takes about ten seconds.
    - cron: "15 23 * * 1-5"
    - cron: "0 1,6,11,19 * * 2-6"
  workflow_dispatch:

concurrency:
  group: collect-etf
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check secret
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; skipping collection."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.skip != 'true'
        run: pip install curl_cffi
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.check.outputs.skip != 'true'
        run: pnpm collect etf
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
